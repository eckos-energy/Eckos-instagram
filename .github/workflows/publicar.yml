name: Publicar no Instagram

on:
  schedule:
    - cron: "*/15 * * * *"   # confere a fila a cada 15 minutos
  push:
    paths: ["fila/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar posts aprovados
        id: pub
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/publicar.py
      - name: Registrar resultado
        if: always()
        run: |
          git config user.name "eckos-bot"
          git config user.email "eckos-bot@users.noreply.github.com"
          git add -A fila publicados
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza fila de publicação"
            git pull --rebase
            git push
          fi
