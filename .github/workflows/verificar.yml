name: Verificar token

on:
  push:
    paths: ["verificar.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conferir token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/verificar.py
      - name: Gravar resultado
        run: |
          git config user.name "eckos-bot"
          git config user.email "eckos-bot@users.noreply.github.com"
          git add verificacao.json
          git commit -m "Resultado da verificação do token" || exit 0
          git pull --rebase
          git push
